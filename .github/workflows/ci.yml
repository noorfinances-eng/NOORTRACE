name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: contracts, journal, verifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  vecteurs:
    name: vecteurs CT-1 à CT-7, régénération déterministe et implémentations indépendantes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: spec/vecteurs/ct-2/verificateur-independant/go.mod
          # bibliothèque standard seulement : aucun go.sum, rien à mettre en cache
          cache: false
      - run: npm ci
      - name: regenerate the CT-1 vectors and require identical bytes
        run: |
          npm run vecteurs:ct1
          git diff --exit-code -- spec/vecteurs/ct-1
      - name: clean-room Go verifier against the CT-1 JavaScript vectors
        working-directory: spec/vecteurs/ct-1/verificateur-independant
        run: |
          gofmt -l . && test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go run . ..
      - name: regenerate the CT-2 vectors and require identical bytes
        run: |
          npm run vecteurs:ct2
          git diff --exit-code -- spec/vecteurs/ct-2
          test -z "$(git status --porcelain --untracked-files=all -- spec/vecteurs/ct-2)"
      - name: clean-room Go verifier against the CT-2 JavaScript vectors
        working-directory: spec/vecteurs/ct-2/verificateur-independant
        run: |
          gofmt -l . && test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go run . ..
      # Vecteurs CT-3 (spec/CT-3-approbations.md, annexe A, EX-A.11) : le
      # générateur scripts/vecteurs/generer-ct3.mjs n'efface et ne réécrit que
      # ses propres entrées de spec/vecteurs/ct-3, jamais
      # verificateur-independant/ ; tout doit être redonné à l'identique, sans
      # fichier de plus.
      - name: régénérer les vecteurs CT-3 et exiger les mêmes octets, sans fichier de plus
        run: |
          npm run vecteurs:ct3
          git diff --exit-code -- spec/vecteurs/ct-3
          test -z "$(git status --porcelain --untracked-files=all -- spec/vecteurs/ct-3)"
      # Vérificateur Go indépendant de CT-3 (EX-A.10) : zéro discordance exigée.
      - name: vérificateur Go indépendant contre les vecteurs CT-3
        working-directory: spec/vecteurs/ct-3/verificateur-independant
        run: |
          gofmt -l . && test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go run . ..
      # Vecteurs CT-4 (spec/CT-4-registre.md, annexe A, EX-A.1 et EX-A.7) : le
      # générateur scripts/vecteurs/generer-ct4.mjs n'efface et ne réécrit que
      # ses propres entrées de spec/vecteurs/ct-4, jamais verificateur-independant/ ;
      # il ne lit ni le réseau ni hh-artifacts/. Entrées lues et jamais réécrites :
      # manifestes et clés de CT-1, capture du registre de CT-6, jeu de
      # test/fixtures/certificat-commit/, chain/config/alloc-dev.json et
      # l'exemple de manifeste d'instance de CT-4 §4.8.
      - name: régénérer les vecteurs CT-4 et exiger les mêmes octets, sans fichier de plus
        run: |
          npm run vecteurs:ct4
          git diff --exit-code -- spec/vecteurs/ct-4
          test -z "$(git status --porcelain --untracked-files=all -- spec/vecteurs/ct-4)"
      # Vérificateur Go indépendant de CT-4 (EX-A.5, EX-A.7) : zéro discordance
      # exigée.
      - name: vérificateur Go indépendant contre les vecteurs CT-4
        working-directory: spec/vecteurs/ct-4/verificateur-independant
        run: |
          gofmt -l . && test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go run . ..
      # Vecteurs CT-6 (spec/CT-6-verificateur.md, annexe A) : un seul générateur,
      # scripts/vecteurs/generer-ct6.mjs, rejoue les familles rfc3161, ots et
      # registre, les fichiers d'ancres de test, les dossiers complets (chacun
      # vérifié par scripts/lib/verificateur.mjs contre ses attendus) et INDEX.md.
      # Entrées lues et jamais réécrites : registre/capture/ (capture unique du
      # réseau de développement), rfc3161/cles/*.cle.pem et confrontation/.
      # Tout le reste doit être redonné à l'identique, sans fichier de plus.
      - name: régénérer les vecteurs CT-6 et exiger les mêmes octets, sans fichier de plus
        run: |
          npm run vecteurs:ct6
          git diff --exit-code -- spec/vecteurs/ct-6
          test -z "$(git status --porcelain --untracked-files=all -- spec/vecteurs/ct-6)"
      # Vecteurs CT-5 (spec/CT-5-ancrage.md, annexe A, EX-A.1 et EX-A.7) : le
      # générateur scripts/vecteurs/generer-ct5.mjs n'efface et ne réécrit que
      # ses propres entrées de spec/vecteurs/ct-5, jamais verificateur-independant/
      # ni confrontation/. Entrées lues et jamais réécrites : l'exemple de
      # référence de CT-1, les manifestes et clés de spec/vecteurs/ct-1, les clés
      # de l'autorité de test de CT-6 et deux preuves de spec/vecteurs/ct-6/ots.
      - name: régénérer les vecteurs CT-5 et exiger les mêmes octets, sans fichier de plus
        run: |
          npm run vecteurs:ct5
          git diff --exit-code -- spec/vecteurs/ct-5
          test -z "$(git status --porcelain --untracked-files=all -- spec/vecteurs/ct-5)"
      # Vérificateur Go indépendant de CT-5 (EX-A.4, EX-A.7) : zéro discordance exigée.
      - name: vérificateur Go indépendant contre les vecteurs CT-5
        working-directory: spec/vecteurs/ct-5/verificateur-independant
        run: |
          gofmt -l . && test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go run . ..
      # Vecteurs CT-7 (spec/CT-7-securite-et-conformite.md, annexe A, EX-A.2,
      # EX-A.12, EX-A.26 à EX-A.28) : le générateur scripts/vecteurs/generer-ct7.mjs
      # écrit menaces.json depuis les tables du texte, les procès-verbaux de
      # cérémonie, les clés de test, les attestations, la matrice de conformité
      # et ses cas invalides, les épreuves et INDEX.md ; il n'efface et ne
      # réécrit que ses propres entrées, jamais confrontation/ ni
      # verificateur-independant/, et ne touche aucun fichier de ct-1 à ct-6.
      # Tout doit être redonné à l'identique, sans fichier de plus.
      - name: régénérer les vecteurs CT-7 et exiger les mêmes octets, sans fichier de plus
        run: |
          npm run vecteurs:ct7
          git diff --exit-code -- spec/vecteurs/ct-7
          test -z "$(git status --porcelain --untracked-files=all -- spec/vecteurs/ct-7)"
      # Vérificateur Go indépendant de CT-7 (EX-A.21 à EX-A.23, EX-A.26,
      # EX-A.27) : écrit depuis le seul texte de CT-7, de CT-1 §6.3 et des
      # schémas ; D_C et CR-1 à CR-11 de chaque procès-verbal, JCS(P), D_P,
      # adresses recouvrées et AT-1 à AT-4 des attestations, signatures
      # croisées, MX-1 à MX-3, MX-5 et MX-9 de la matrice, menaces.json
      # contre son schéma et les tables du texte, clés de test. Zéro
      # discordance exigée.
      - name: vérificateur Go indépendant contre les vecteurs CT-7
        working-directory: spec/vecteurs/ct-7/verificateur-independant
        run: |
          gofmt -l . && test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go run . ..
      # Vérificateur de renvois de CT-7 (EX-A.13, EX-A.18) : RV-1 à RV-9 (chaque
      # renvoi EX- de menaces.json et de la table de traçabilité existe, chaque
      # menace a une réponse, tables du texte égales au fichier, occurrences de
      # « CT-7 » toutes tracées) et MX-1 à MX-9 sur matrice-conformite.json.
      - name: vérificateur de renvois et de la matrice de CT-7 (code 0 exigé)
        run: node scripts/conformite/verifier-renvois.mjs
      - name: vérificateur de procès-verbal de cérémonie sur l'exemple de CT-7 §5.10 (code 0)
        run: node scripts/verify/ceremonie.mjs spec/vecteurs/ct-7/ceremonies/valide-creation-enregistreur/proces-verbal.json
      - name: vérificateur de référence sur le dossier complet CT-6 et un dossier CT-1 (codes 0 et 3)
        run: |
          node scripts/verify/dossier.mjs spec/vecteurs/ct-6/dossiers/valide-seq-7-complet \
            --ancres spec/vecteurs/ct-6/ancres/ancres-test.json \
            --entetes-bitcoin spec/vecteurs/ct-6/ots/entetes/chaine.json
          node scripts/verify/dossier.mjs spec/vecteurs/ct-1/dossiers/valide-seq-7
          set +e
          node scripts/verify/dossier.mjs spec/vecteurs/ct-1/dossiers/valide-seq-7 --exiger 4,5,8 > /dev/null
          test $? -eq 3

  # Test de bout en bout de la console de référence de CT-3 dans Chromium
  # (spec/CT-3-approbations.md, EX-13.36, EX-A.11) : Playwright 1.56.1, la
  # version mesurée de console/LISEZMOI.md, est installé sans être ajouté à
  # package.json, puis son Chromium et les dépendances système du navigateur ;
  # ce travail accède au réseau pour ces deux téléchargements. Il tourne sur un
  # exécuteur Ubuntu 24.04 : Playwright 1.56.1 refuse d'installer Chromium sur
  # Ubuntu 26.04, le système d'ubuntu-latest (« Playwright does not support
  # chromium on ubuntu26.04-x64 »).
  # NOORTRACE_EXIGER_CHROMIUM=1 rend le saut impossible : si Playwright ou
  # Chromium ne se lancent pas, le test échoue au lieu d'être mis en attente,
  # et la dernière commande refuse toute ligne « pending » du rapport.
  console-chromium:
    name: console de référence de CT-3 dans Chromium par Playwright 1.56.1, sans saut
    runs-on: ubuntu-24.04
    env:
      NOORTRACE_EXIGER_CHROMIUM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: installer Playwright 1.56.1 hors de package.json, puis Chromium et ses dépendances
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: test/console.test.js, aucun test Chromium en attente
        run: |
          set -o pipefail
          npx hardhat --config hardhat.config.mjs test test/console.test.js 2>&1 | tee "$RUNNER_TEMP/console.txt"
          if grep -E '^[[:space:]]+[0-9]+ pending' "$RUNNER_TEMP/console.txt"; then exit 1; fi

  # Confrontation des vecteurs CT-2, CT-3, CT-5, CT-6 et CT-7 par des
  # implémentations tierces (spec/CT-6-verificateur.md, annexe A.8 ;
  # spec/CT-5-ancrage.md, annexe A.6 ; spec/CT-2-enregistreur.md, annexes B.5
  # et B.8 ; spec/CT-3-approbations.md, annexe A.11 ;
  # spec/CT-7-securite-et-conformite.md, annexe A.13 ;
  # spec/vecteurs/ct-*/confrontation/). Les sorties publiées
  # (confrontation/sorties/) viennent d'OpenSSL 3.0.13, de
  # python-opentimestamps 0.4.5, de transparency-dev/merkle v0.0.2, de
  # google-genai 2.33.0, d'opentelemetry-proto 1.45.1 avec protobuf 7.36.2,
  # d'ethers 6.17.0 (celui du dépôt) et d'eth-account 0.14.0 ;
  # ici, chaque programme est rejoué avec l'OpenSSL de l'exécuteur, les mêmes
  # versions des paquets Python et la même version du module Go, et doit rendre
  # le code 0 (aucune discordance) ; les sorties de CT-2, de CT-3 et de CT-7
  # doivent en outre être égales, octet pour octet, aux sorties publiées. La
  # confrontation du registre (go-ethereum et noorcore) exige une copie de
  # noorchain-core : elle n'est pas rejouée ici, et test/confrontation.test.js
  # vérifie que sa sortie publiée porte sur les vecteurs du dépôt.
  confrontation:
    name: vecteurs CT-2, CT-3, CT-5, CT-6 et CT-7 confrontés à openssl, à python-opentimestamps, à transparency-dev/merkle, à google-genai, à opentelemetry-proto, à ethers et à eth-account
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # CT-3 (annexe A.11, EX-A.18, EX-A.19) : chaque signature des vecteurs
      # (votes, remises, normalisation, console, inscriptions) recouvrée par
      # verifyMessage d'ethers, version du dépôt, après le contrôle de forme du
      # script (EX-9.22) ; fichiers de clé déchiffrés par
      # decryptKeystoreJsonSync. Code 0 et sortie égale à la sortie publiée.
      - name: CT-3 signatures par ethers
        run: |
          set -o pipefail
          node spec/vecteurs/ct-3/confrontation/ethers/confronter_ethers.mjs spec/vecteurs/ct-3 | tee "$RUNNER_TEMP/ethers.txt" | tail -1
          diff spec/vecteurs/ct-3/confrontation/sorties/ethers.txt "$RUNNER_TEMP/ethers.txt"
      # CT-3 (annexe A.11, EX-A.18, EX-A.19) : les mêmes signatures recouvrées
      # par Account.recover_message d'eth-account 0.14.0 (encode_defunct par
      # hexstr= et primitive= pour un vote, par primitive= et text= pour une
      # inscription), après le contrôle de forme du script (EX-9.22) ; fichiers
      # de clé déchiffrés par Account.decrypt ; versions exactes de toutes les
      # dépendances (exigences.txt, --no-deps). Code 0 et sortie égale à la
      # sortie publiée.
      - name: CT-3 signatures par eth-account 0.14.0 (environnement virtuel)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv-eth-account"
          "$RUNNER_TEMP/venv-eth-account/bin/pip" install --only-binary :all: --no-deps -r spec/vecteurs/ct-3/confrontation/eth-account/exigences.txt
          "$RUNNER_TEMP/venv-eth-account/bin/pip" check
          set -o pipefail
          "$RUNNER_TEMP/venv-eth-account/bin/python" -I spec/vecteurs/ct-3/confrontation/eth-account/confronter_eth_account.py spec/vecteurs/ct-3 | tee "$RUNNER_TEMP/eth-account.txt" | tail -1
          diff spec/vecteurs/ct-3/confrontation/sorties/eth-account.txt "$RUNNER_TEMP/eth-account.txt"
      # CT-7 (EX-A.24, EX-A.25, EX-A.27) : chaque signature des procès-verbaux
      # de ct-7/ceremonies/ recouvrée sur D_C, et chaque signature
      # d'attestation (ct-7/attestations/, dossiers de ct-1 et de ct-6 à
      # partie attestation-perimetre.json) recouvrée sur D_P, par verifyMessage
      # d'ethers, version du dépôt, après le contrôle de forme du programme
      # (CR-11, EX-7.6). Code 0 et sortie égale à la sortie publiée.
      - name: CT-7 signatures des procès-verbaux et des attestations par ethers
        run: |
          set -o pipefail
          node spec/vecteurs/ct-7/confrontation/ceremonies/confronter_ethers.mjs spec/vecteurs/ct-7 | tee "$RUNNER_TEMP/ct7-ceremonies-ethers.txt" | tail -1
          diff spec/vecteurs/ct-7/confrontation/ceremonies/sorties/ethers.txt "$RUNNER_TEMP/ct7-ceremonies-ethers.txt"
          node spec/vecteurs/ct-7/confrontation/attestations/confronter_ethers.mjs spec/vecteurs/ct-7 spec/vecteurs/ct-1 spec/vecteurs/ct-6 | tee "$RUNNER_TEMP/ct7-attestations-ethers.txt" | tail -1
          diff spec/vecteurs/ct-7/confrontation/attestations/sorties/ethers.txt "$RUNNER_TEMP/ct7-attestations-ethers.txt"
      # CT-7 (EX-A.24, EX-A.25, EX-A.27) : les mêmes signatures recouvrées par
      # Account.recover_message d'eth-account 0.14.0 (encode_defunct par
      # primitive= et hexstr= sur le condensé, par primitive= et text= pour le
      # texte d'inscription d'un cas croisé) ; versions exactes de toutes les
      # dépendances (exigences.txt de chaque répertoire, --no-deps). Code 0 et
      # sortie égale à la sortie publiée.
      - name: CT-7 signatures des procès-verbaux et des attestations par eth-account 0.14.0 (environnement virtuel)
        run: |
          set -o pipefail
          for partie in ceremonies attestations; do
            python3 -m venv "$RUNNER_TEMP/venv-ct7-$partie"
            "$RUNNER_TEMP/venv-ct7-$partie/bin/pip" install --only-binary :all: --no-deps -r spec/vecteurs/ct-7/confrontation/$partie/exigences.txt
            "$RUNNER_TEMP/venv-ct7-$partie/bin/pip" check
          done
          "$RUNNER_TEMP/venv-ct7-ceremonies/bin/python" -I spec/vecteurs/ct-7/confrontation/ceremonies/confronter_eth_account.py spec/vecteurs/ct-7 | tee "$RUNNER_TEMP/ct7-ceremonies-eth-account.txt" | tail -1
          diff spec/vecteurs/ct-7/confrontation/ceremonies/sorties/eth-account.txt "$RUNNER_TEMP/ct7-ceremonies-eth-account.txt"
          "$RUNNER_TEMP/venv-ct7-attestations/bin/python" -I spec/vecteurs/ct-7/confrontation/attestations/confronter_eth_account.py spec/vecteurs/ct-7 spec/vecteurs/ct-1 spec/vecteurs/ct-6 | tee "$RUNNER_TEMP/ct7-attestations-eth-account.txt" | tail -1
          diff spec/vecteurs/ct-7/confrontation/attestations/sorties/eth-account.txt "$RUNNER_TEMP/ct7-attestations-eth-account.txt"
      - name: rfc3161 par openssl (ts, cms, asn1parse, x509, crl, verify)
        run: |
          set -o pipefail
          openssl version
          python3 -I spec/vecteurs/ct-6/confrontation/rfc3161/confronter_rfc3161.py spec/vecteurs/ct-6 "$(mktemp -d)" | tail -12
      # CT-5 (spec/CT-5-ancrage.md, annexe A.6) : requêtes TimeStampReq et
      # réponses TimeStampResp par openssl (ts -query, asn1parse, ts -reply,
      # ts -verify), jetons des dossiers de CT-6 à partie points-de-controle.json
      # compris (CT-6 EX-A.17).
      - name: CT-5 requetes et reponses par openssl (ts -query, asn1parse, ts -reply, ts -verify)
        run: |
          set -o pipefail
          python3 -I spec/vecteurs/ct-5/confrontation/requetes/confronter_requetes.py spec/vecteurs/ct-5 "$(mktemp -d)" | tail -4
          python3 -I spec/vecteurs/ct-5/confrontation/reponses/confronter_reponses.py spec/vecteurs/ct-5 "$(mktemp -d)" | tail -6
      - name: ots par python-opentimestamps 0.4.5 (environnement virtuel, hors ligne après installation)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --only-binary :all: opentimestamps==0.4.5 python-bitcoinlib==0.12.2
          set -o pipefail
          "$RUNNER_TEMP/venv/bin/python" -I spec/vecteurs/ct-6/confrontation/ots/confronter_ots.py spec/vecteurs/ct-6 | tail -6
          "$RUNNER_TEMP/venv/bin/python" -I spec/vecteurs/ct-5/confrontation/ots/confronter_ots.py spec/vecteurs/ct-5 | tail -4
      # CT-2 (annexe B.5) : requêtes, réponses, morceaux de flux, formes
      # consolidées et refus des cas pieces-modele/gemini-* analysés par les
      # types et le client du SDK officiel (transport simulé, sans réseau) ;
      # versions exactes de toutes les dépendances (exigences.txt, --no-deps).
      - name: CT-2 Gemini par google-genai 2.33.0 (environnement virtuel, hors ligne après installation)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv-genai"
          "$RUNNER_TEMP/venv-genai/bin/pip" install --only-binary :all: --no-deps -r spec/vecteurs/ct-2/confrontation/gemini/exigences.txt
          "$RUNNER_TEMP/venv-genai/bin/pip" check
          set -o pipefail
          "$RUNNER_TEMP/venv-genai/bin/python" -I spec/vecteurs/ct-2/confrontation/gemini/confronter_gemini.py spec/vecteurs/ct-2 | tee "$RUNNER_TEMP/gemini.txt" | tail -3
          diff spec/vecteurs/ct-2/confrontation/sorties/gemini.txt "$RUNNER_TEMP/gemini.txt"
      # CT-2 (section 6.8, annexe B.8) : requêtes OTLP JSON et protobuf de la
      # famille otel/ analysées en ExportTraceServiceRequest (json_format.Parse
      # après conversion des identifiants, FromString), forme normalisée de
      # chaque span recalculée et comparée, réponses, paires JSON / protobuf.
      - name: CT-2 otel par opentelemetry-proto 1.45.1 et protobuf 7.36.2 (environnement virtuel)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv-otel"
          "$RUNNER_TEMP/venv-otel/bin/pip" install --only-binary :all: --no-deps -r spec/vecteurs/ct-2/confrontation/otel/exigences.txt
          "$RUNNER_TEMP/venv-otel/bin/pip" check
          set -o pipefail
          "$RUNNER_TEMP/venv-otel/bin/python" -I spec/vecteurs/ct-2/confrontation/otel/confronter_otel.py spec/vecteurs/ct-2 | tee "$RUNNER_TEMP/otel.txt" | tail -6
          diff spec/vecteurs/ct-2/confrontation/sorties/otel.txt "$RUNNER_TEMP/otel.txt"
      # Version de Go épinglée à celle des sorties publiées (en-tête de
      # sorties/coherence.txt : go1.24.7) ; ce job, seul de la CI, accède au
      # réseau (pip et mandataire de modules Go), CT-5 EX-A.7.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
          cache-dependency-path: spec/vecteurs/ct-5/confrontation/coherence/go.sum
      # CT-5 (annexe A.6) et CT-1 §10.7 : preuves de cohérence RFC 9162 des
      # vecteurs CT-1 révision 0.3 (merkle/coherence.json, points-de-controle/
      # attendu.json, parties points-de-controle.json des dossiers de CT-1 et de
      # CT-6) confrontées à l'implémentation de référence transparency-dev/merkle
      # v0.0.2 : racines et preuves régénérées nœud pour nœud, verdicts de
      # proof.VerifyConsistency, sondes de corruption. Le module Go est résolu
      # par le proxy de modules (go.sum épinglé), comme pip pour opentimestamps.
      - name: CT-1 preuves de cohérence par transparency-dev/merkle v0.0.2 (RFC 6962 et 9162)
        working-directory: spec/vecteurs/ct-5/confrontation/coherence
        run: |
          set -o pipefail
          gofmt -l . && test -z "$(gofmt -l .)"
          go vet ./...
          go run . ../../../ct-1 ../../../ct-6 | tail -4
