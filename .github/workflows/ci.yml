name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: contracts, journal, verifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      # audit npm des dépendances de production, outils de développement exclus :
      # toute alerte, quelle que soit sa gravité, fait échouer le travail (SECURITY.md)
      - run: npm audit --omit=dev --audit-level=low
      # CT-8 EX-10.10 et EX-A.27 : promtool de l'archive officielle de Prometheus
      # 3.5.0, vérifiée par son SHA-256 avant extraction ; il vérifie et teste les
      # règles de référence, puis est passé aux essais (NOORTRACE_PROMTOOL), qui
      # rejouent TV-76 sans attente.
      - name: promtool 3.5.0 (CT-8 EX-10.10, EX-A.27), règles d'alerte de référence vérifiées et testées
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          curl -fsSL -o "$d/prometheus.tar.gz" \
            https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz
          echo "e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a  $d/prometheus.tar.gz" | sha256sum --strict -c -
          mkdir "$d/x"
          tar -xzf "$d/prometheus.tar.gz" -C "$d/x" --strip-components=1 prometheus-3.5.0.linux-amd64/promtool
          "$d/x/promtool" --version
          "$d/x/promtool" check rules deploiement/observabilite/regles-noortrace.yml
          "$d/x/promtool" test rules deploiement/observabilite/tests-regles.yml
          echo "NOORTRACE_PROMTOOL=$d/x/promtool" >> "$GITHUB_ENV"
      - run: npm test

  vecteurs:
    name: vecteurs CT-1 à CT-9, régénération déterministe et implémentations indépendantes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: spec/vecteurs/ct-2/verificateur-independant/go.mod
          # bibliothèque standard seulement : aucun go.sum, rien à mettre en cache
          cache: false
      - run: npm ci
      - name: regenerate the CT-1 vectors and require identical bytes
        run: |
          npm run vecteurs:ct1
          git diff --exit-code -- spec/vecteurs/ct-1
      - name: clean-room Go verifier against the CT-1 JavaScript vectors
        working-directory: spec/vecteurs/ct-1/verificateur-independant
        run: |
          gofmt -l . && test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go run . ..
      - name: regenerate the CT-2 vectors and require identical bytes
        run: |
          npm run vecteurs:ct2
          git diff --exit-code -- spec/vecteurs/ct-2
          test -z "$(git status --porcelain --untracked-files=all -- spec/vecteurs/ct-2)"
      - name: clean-room Go verifier against the CT-2 JavaScript vectors
        working-directory: spec/vecteurs/ct-2/verificateur-independant
        run: |
          gofmt -l . && test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go run . ..
      # Vecteurs CT-3 (spec/CT-3-approbations.md, annexe A, EX-A.11) : le
      # générateur scripts/vecteurs/generer-ct3.mjs n'efface et ne réécrit que
      # ses propres entrées de spec/vecteurs/ct-3, jamais
      # verificateur-independant/ ; tout doit être redonné à l'identique, sans
      # fichier de plus.
      - name: régénérer les vecteurs CT-3 et exiger les mêmes octets, sans fichier de plus
        run: |
          npm run vecteurs:ct3
          git diff --exit-code -- spec/vecteurs/ct-3
          test -z "$(git status --porcelain --untracked-files=all -- spec/vecteurs/ct-3)"
      # Vérificateur Go indépendant de CT-3 (EX-A.10) : zéro discordance exigée.
      - name: vérificateur Go indépendant contre les vecteurs CT-3
        working-directory: spec/vecteurs/ct-3/verificateur-independant
        run: |
          gofmt -l . && test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go run . ..
      # Vecteurs CT-4 (spec/CT-4-registre.md, annexe A, EX-A.1 et EX-A.7) : le
      # générateur scripts/vecteurs/generer-ct4.mjs n'efface et ne réécrit que
      # ses propres entrées de spec/vecteurs/ct-4, jamais verificateur-independant/ ;
      # il ne lit ni le réseau ni hh-artifacts/. Entrées lues et jamais réécrites :
      # manifestes et clés de CT-1, capture du registre de CT-6, jeu de
      # test/fixtures/certificat-commit/, chain/config/alloc-dev.json et
      # l'exemple de manifeste d'instance de CT-4 §4.8.
      - name: régénérer les vecteurs CT-4 et exiger les mêmes octets, sans fichier de plus
        run: |
          npm run vecteurs:ct4
          git diff --exit-code -- spec/vecteurs/ct-4
          test -z "$(git status --porcelain --untracked-files=all -- spec/vecteurs/ct-4)"
      # Vérificateur Go indépendant de CT-4 (EX-A.5, EX-A.7) : zéro discordance
      # exigée.
      - name: vérificateur Go indépendant contre les vecteurs CT-4
        working-directory: spec/vecteurs/ct-4/verificateur-independant
        run: |
          gofmt -l . && test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go run . ..
      # Vecteurs CT-6 (spec/CT-6-verificateur.md, annexe A) : un seul générateur,
      # scripts/vecteurs/generer-ct6.mjs, rejoue les familles rfc3161, ots et
      # registre, les fichiers d'ancres de test, les dossiers complets (chacun
      # vérifié par scripts/lib/verificateur.mjs contre ses attendus) et INDEX.md.
      # Entrées lues et jamais réécrites : registre/capture/ (capture unique du
      # réseau de développement), rfc3161/cles/*.cle.pem et confrontation/.
      # Tout le reste doit être redonné à l'identique, sans fichier de plus.
      - name: régénérer les vecteurs CT-6 et exiger les mêmes octets, sans fichier de plus
        run: |
          npm run vecteurs:ct6
          git diff --exit-code -- spec/vecteurs/ct-6
          test -z "$(git status --porcelain --untracked-files=all -- spec/vecteurs/ct-6)"
      # Vecteurs CT-5 (spec/CT-5-ancrage.md, annexe A, EX-A.1 et EX-A.7) : le
      # générateur scripts/vecteurs/generer-ct5.mjs n'efface et ne réécrit que
      # ses propres entrées de spec/vecteurs/ct-5, jamais verificateur-independant/
      # ni confrontation/. Entrées lues et jamais réécrites : l'exemple de
      # référence de CT-1, les manifestes et clés de spec/vecteurs/ct-1, les clés
      # de l'autorité de test de CT-6 et deux preuves de spec/vecteurs/ct-6/ots.
      - name: régénérer les vecteurs CT-5 et exiger les mêmes octets, sans fichier de plus
        run: |
          npm run vecteurs:ct5
          git diff --exit-code -- spec/vecteurs/ct-5
          test -z "$(git status --porcelain --untracked-files=all -- spec/vecteurs/ct-5)"
      # Vérificateur Go indépendant de CT-5 (EX-A.4, EX-A.7) : zéro discordance exigée.
      - name: vérificateur Go indépendant contre les vecteurs CT-5
        working-directory: spec/vecteurs/ct-5/verificateur-independant
        run: |
          gofmt -l . && test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go run . ..
      # Vecteurs CT-7 (spec/CT-7-securite-et-conformite.md, annexe A, EX-A.2,
      # EX-A.12, EX-A.26 à EX-A.28) : le générateur scripts/vecteurs/generer-ct7.mjs
      # écrit menaces.json depuis les tables du texte, les procès-verbaux de
      # cérémonie, les clés de test, les attestations, la matrice de conformité
      # et ses cas invalides, les épreuves et INDEX.md ; il n'efface et ne
      # réécrit que ses propres entrées, jamais confrontation/ ni
      # verificateur-independant/, et ne touche aucun fichier de ct-1 à ct-6.
      # Tout doit être redonné à l'identique, sans fichier de plus.
      - name: régénérer les vecteurs CT-7 et exiger les mêmes octets, sans fichier de plus
        run: |
          npm run vecteurs:ct7
          git diff --exit-code -- spec/vecteurs/ct-7
          test -z "$(git status --porcelain --untracked-files=all -- spec/vecteurs/ct-7)"
      # Vérificateur Go indépendant de CT-7 (EX-A.21 à EX-A.23, EX-A.26,
      # EX-A.27) : écrit depuis le seul texte de CT-7, de CT-1 §6.3 et des
      # schémas ; D_C et CR-1 à CR-11 de chaque procès-verbal, JCS(P), D_P,
      # adresses recouvrées et AT-1 à AT-4 des attestations, signatures
      # croisées, MX-1 à MX-3, MX-5 et MX-9 de la matrice, menaces.json
      # contre son schéma et les tables du texte, clés de test. Zéro
      # discordance exigée.
      - name: vérificateur Go indépendant contre les vecteurs CT-7
        working-directory: spec/vecteurs/ct-7/verificateur-independant
        run: |
          gofmt -l . && test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go run . ..
      # Vérificateur de renvois de CT-7 (EX-A.13, EX-A.18) : RV-1 à RV-9 (chaque
      # renvoi EX- de menaces.json et de la table de traçabilité existe, chaque
      # menace a une réponse, tables du texte égales au fichier, occurrences de
      # « CT-7 » toutes tracées) et MX-1 à MX-9 sur matrice-conformite.json.
      - name: vérificateur de renvois et de la matrice de CT-7 (code 0 exigé)
        run: node scripts/conformite/verifier-renvois.mjs
      - name: vérificateur de procès-verbal de cérémonie sur l'exemple de CT-7 §5.10 (code 0)
        run: node scripts/verify/ceremonie.mjs spec/vecteurs/ct-7/ceremonies/valide-creation-enregistreur/proces-verbal.json
      - name: vérificateur de référence sur le dossier complet CT-6 et un dossier CT-1 (codes 0 et 3)
        run: |
          node scripts/verify/dossier.mjs spec/vecteurs/ct-6/dossiers/valide-seq-7-complet \
            --ancres spec/vecteurs/ct-6/ancres/ancres-test.json \
            --entetes-bitcoin spec/vecteurs/ct-6/ots/entetes/chaine.json
          node scripts/verify/dossier.mjs spec/vecteurs/ct-1/dossiers/valide-seq-7
          set +e
          node scripts/verify/dossier.mjs spec/vecteurs/ct-1/dossiers/valide-seq-7 --exiger 4,5,8 > /dev/null
          test $? -eq 3
      # Vecteurs de CT-8 (spec/CT-8-deploiement-et-exploitation.md, annexe A,
      # EX-A.1, EX-A.25, EX-A.26, EX-A.29) : le générateur écrit les familles
      # conteneurs/, controle-prealable/, dimensionnement/ et paquets/ et
      # INDEX.md ; il n'efface et ne réécrit que ses propres familles, jamais
      # confrontation/ ni verificateur-independant/, et ne touche aucun
      # fichier de ct-1 à ct-7. Deux exécutions : mêmes octets que le dépôt,
      # sans fichier de plus.
      - name: régénérer les vecteurs CT-8 deux fois et exiger les mêmes octets, sans fichier de plus
        run: |
          npm run vecteurs:ct8
          git diff --exit-code -- spec/vecteurs/ct-8
          test -z "$(git status --porcelain --untracked-files=all -- spec/vecteurs/ct-8)"
          npm run vecteurs:ct8
          git diff --exit-code -- spec/vecteurs
          test -z "$(git status --porcelain --untracked-files=all -- spec/vecteurs)"
      # Fichiers de conteneur de référence (CT-8 §4, EX-4.2) : CO-1 à CO-14 par
      # l'outil du dépôt, puis l'analyse de Docker Compose, sans construire ni
      # lancer aucun conteneur ; production.yaml exige ses quatre variables
      # (adresses de documentation de la RFC 5737). La présence de Docker
      # Compose sur l'exécuteur hébergé n'est pas vérifiée par CT-8.
      - name: fichiers de conteneur de référence, CO-1 à CO-14 et docker compose config (codes 0)
        run: |
          npm run deploiement:conteneurs
          docker compose version
          docker compose --project-directory deploiement -f deploiement/compose/rapide.yaml config --quiet
          NOORTRACE_IP_INTERNE=192.0.2.40 NOORCORE_CHAIN_ID=noortrace-2124-dev NOORCORE_EVM_CHAIN_ID=2124 \
            NOORCORE_LEADER_RPC=https://registre-test.example/rpc \
            docker compose --project-directory deploiement -f deploiement/compose/production.yaml config --quiet
      # Renvois vers CT-8 (EX-0.1, annexe A.2) : chaque occurrence de « CT-8 »
      # de spec/*.md a sa ligne dans la table de CT-8 §0.2, et chaque réponse
      # cite des identifiants qui existent dans CT-8.
      - name: vérificateur de renvois de CT-8 (code 0 exigé)
        run: npm run deploiement:renvois
      # Calculateur et contrôle préalable rejoués sur un cas de chaque famille
      # par la ligne de commande (les tests Node rejouent tous les cas).
      - name: dimensionnement et contrôle préalable rejoués sur les vecteurs (codes 0 et 1)
        run: |
          node scripts/deploiement/dimensionner.mjs --entrees spec/vecteurs/ct-8/dimensionnement/reference.json --json \
            | cmp - <(node -e 'process.stdout.write(JSON.stringify(require("./spec/vecteurs/ct-8/dimensionnement/reference.json").attendu, null, 2) + "\n")')
          node scripts/deploiement/controle-prealable.mjs --profil rapide \
            --observations spec/vecteurs/ct-8/controle-prealable/pret-rapide.json --json > /dev/null
          set +e
          node scripts/deploiement/controle-prealable.mjs --profil rapide \
            --observations spec/vecteurs/ct-8/controle-prealable/port-occupe.json --json > /dev/null
          test $? -eq 1
      # Outils de l'exploitation (CT-8 EX-11.7, EX-12.10, EX-11.18, EX-11.20)
      # rejoués sur un cas de chaque famille par la ligne de commande (les
      # tests Node rejouent tous les cas) ; archive de déploiement (EX-3.6)
      # écrite hors du dépôt et outils lancés depuis elle.
      - name: outils de l'exploitation et archive de déploiement (codes 0 et 1)
        run: |
          V=spec/vecteurs/ct-8
          node scripts/deploiement/verifier-journal.mjs $V/journaux/valide --cles $V/journaux/valide/cles.json --json > /dev/null
          node scripts/deploiement/rapport-observation.mjs $V/observation/evenements.ndjson --json | cmp - $V/observation/rapport-attendu.json
          node scripts/deploiement/proces-verbal.mjs verifier $V/proces-verbaux/valides/migration-support.json \
            --racine $V/proces-verbaux/racine --cles $V/proces-verbaux/cles.json --json > /dev/null
          node scripts/deploiement/consultations.mjs verifier $V/consultations/valide/consultations-2026-11-05.ndjson --json > /dev/null
          set +e
          node scripts/deploiement/verifier-journal.mjs $V/journaux/ligne-modifiee --cles $V/journaux/ligne-modifiee/cles.json --json > /dev/null
          test $? -eq 1 || exit 1
          set -e
          A="$RUNNER_TEMP/archive-deploiement"
          node scripts/deploiement/construire-archive.mjs --sortie "$A"
          (cd "$A" && sha256sum --strict --quiet -c SHA256SUMS)
          (cd "$A" && env -i PATH=/usr/bin:/bin "$(command -v node)" scripts/deploiement/controle-prealable.mjs --profil rapide \
            --observations "$GITHUB_WORKSPACE/$V/controle-prealable/pret-rapide.json" --json > /dev/null)
      # Vérificateur Go indépendant de CT-8 (EX-A.21, EX-A.22, EX-A.24,
      # EX-A.25, EX-A.29) : écrit depuis le seul texte de CT-8 et les
      # schémas ; DM-1 à DM-22 et EX-9.3 à l'égalité exacte, IP-1 à IP-13 et
      # EX-6.3 sur les observations des cas, chaque archive des paquets lue
      # par archive/tar et par une lecture brute des blocs d'EX-13.14,
      # PR-1 à PR-12, SHA-256, tailles, état, avertissements et code de
      # retour, fichiers des conteneurs et mesures de 9.2. Zéro discordance
      # exigée.
      - name: vérificateur Go indépendant contre les vecteurs CT-8
        working-directory: spec/vecteurs/ct-8/verificateur-independant
        run: |
          gofmt -l . && test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go run . ..
      # Paquet réviseur complet (CT-8 §13, EX-A.29) : construit deux fois depuis
      # la description des vecteurs, chemins rendus absolus et vérificateur
      # joint ; mêmes octets ; vérifié par l'outil du dépôt (code 0, PR-11
      # réussie) ; extrait par GNU tar hors du dépôt, puis vérifié par sa copie
      # jointe sans réseau ni variable d'environnement (code 0 ; PR-11 y est
      # non exécutée, raison auto_comparaison). Extraction par tar -xkf : un
      # nom en double fait échouer tar au lieu de remplacer le premier fichier
      # (13.11). unshare -n exige un privilège, d'où sudo ; la forme sans
      # privilège unshare -rn n'est pas celle de la CI (CT-8 EX-A.29).
      - name: paquet réviseur complet, construit deux fois, vérifié par le dépôt puis par sa copie jointe hors réseau
        run: |
          T=$(mktemp -d)
          node -e '
            const fs = require("fs"), path = require("path");
            const rep = path.resolve("spec/vecteurs/ct-8/paquets");
            const d = JSON.parse(fs.readFileSync(path.join(rep, "description.json"), "utf8"));
            const abs = (p) => (p === null ? null : path.resolve(rep, p));
            d.dossiers = d.dossiers.map((x) => ({ source: abs(x.source), anchors: abs(x.anchors), bitcoin_headers: abs(x.bitcoin_headers) }));
            if (d.attestation) d.attestation = { signed: abs(d.attestation.signed), approver_set: abs(d.attestation.approver_set) };
            d.pieces = d.pieces.map(abs);
            d.include_verifier = true;
            fs.writeFileSync(process.argv[1], JSON.stringify(d, null, 2) + "\n");' "$T/description.json"
          node scripts/paquet-reviseur/construire.mjs --description "$T/description.json" --sortie "$T/a.tar"
          node scripts/paquet-reviseur/construire.mjs --description "$T/description.json" --sortie "$T/b.tar"
          cmp "$T/a.tar" "$T/b.tar"
          H=$(sha256sum "$T/a.tar" | cut -c1-64)
          node scripts/paquet-reviseur/verifier.mjs "$T/a.tar" --empreinte "$H" --json > "$T/rapport.json"
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const pr11 = r.checks.find((c) => c.id === "PR-11");
            if (r.exit_code !== 0 || !pr11 || pr11.status !== "reussi") { console.error(JSON.stringify(pr11)); process.exit(1); }' "$T/rapport.json"
          mkdir "$T/x" && tar -xkf "$T/a.tar" -C "$T/x"
          sudo unshare -n env -i TMPDIR="$T" "$(command -v node)" \
            "$T/x/paquet-reviseur/verificateur/scripts/paquet-reviseur/verifier.mjs" "$T/a.tar" --empreinte "$H"
      # Vecteurs de CT-9 (spec/CT-9-plan-de-tests.md, annexe A, EX-A.1,
      # EX-A.6, EX-A.10) : le générateur écrit catalogue.json, couverture.json
      # (sortie de l'outil de couverture, condensés des spécifications, du
      # catalogue, de menaces.json et de test/*.test.js), l'index TA- par
      # menace, cas/, mesures/, consignations/, les consignes, grilles et
      # extraits des épreuves et INDEX.md ; il n'efface et ne réécrit que ses
      # propres entrées, jamais confrontation/ ni verificateur-independant/,
      # et ne touche aucun fichier de ct-1 à ct-8. Deux exécutions : mêmes
      # octets que le dépôt, sans fichier de plus.
      - name: régénérer les vecteurs CT-9 deux fois et exiger les mêmes octets, sans fichier de plus
        run: |
          npm run vecteurs:ct9
          git diff --exit-code -- spec/vecteurs/ct-9
          test -z "$(git status --porcelain --untracked-files=all -- spec/vecteurs/ct-9)"
          npm run vecteurs:ct9
          git diff --exit-code -- spec/vecteurs
          test -z "$(git status --porcelain --untracked-files=all -- spec/vecteurs)"
      # Outil de couverture de CT-9 (section 5.4, EX-5.8, EX-A.5) : règles (a)
      # à (d), EX-5.5 et égalité des tables du texte avec le catalogue
      # (EX-4.4) ; code 0 exigé, avertissements compris (--strict).
      - name: outil de couverture de CT-9 (code 0 exigé)
        run: |
          node scripts/tests/couverture.mjs
          node scripts/tests/couverture.mjs --strict > /dev/null
      # Rapports de mesure et consignations publiés (CT-9 §11.3, §12.1,
      # EX-A.10) : conformes au schéma et au catalogue ; en phase 2, le
      # rapport de campagne sera comparé au rapport de référence (EX-11.15).
      - name: rapports de mesure et consignations de CT-9 (code 0 exigé)
        run: npm run mesures:ct9
      # Vérificateur Go indépendant de CT-9 (EX-A.17) : écrit depuis le seul
      # texte de CT-9 et les schémas ; recompte la couverture, les menaces,
      # les renvois et les titres, réimprime les tables et compare à
      # couverture.json membre par membre. Zéro discordance exigée.
      - name: vérificateur Go indépendant contre les vecteurs CT-9
        working-directory: spec/vecteurs/ct-9/verificateur-independant
        run: |
          gofmt -l . && test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go run . ..
      # Figeage de la conception v1.0 (spec/figeage/LISEZMOI.md) : le
      # registre des modifications, rejoué depuis le manifeste, doit rendre
      # exactement les fichiers de spec/ ; toute modification, tout ajout et
      # toute suppression non consignés font échouer l'étape (code 0 exigé).
      - name: figeage de la conception v1.0, chaque modification de spec/ consignée (code 0 exigé)
        run: npm run conception:figeage

  # Binaire vérificateur noortrace-verifier (CT-6 §14, étape 2 de la
  # construction) : Go 1.27.3 exactement (EX-14.3), dépendances vendorisées
  # (EX-14.1), rejeu de chaque dossier de spec/vecteurs/ct-1 et ct-6 contre son
  # attendu.json par go test (zéro discordance), deux constructions par la
  # recette d'EX-14.6 dans des répertoires et des caches différents, mêmes
  # octets exigés (EX-14.8), et les quatre preuves d'absence de réseau
  # d'EX-14.5 ; unshare -n demande les droits du superutilisateur, d'où sudo.
  verificateur:
    name: binaire vérificateur Go de CT-6 §14, vecteurs CT-1 et CT-6, construction reproductible, absence de réseau
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=vendor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.27.3
          cache: false
      - name: binaire vérificateur Go, gofmt, vet et rejeu des dossiers CT-1 et CT-6 (zéro discordance)
        working-directory: verificateur
        run: |
          test "$(go env GOVERSION)" = go1.27.3
          test -z "$(gofmt -l $(go list -f '{{.Dir}}' ./...))"
          go vet ./...
          go test -count=1 ./...
      - name: binaire vérificateur Go, deux constructions reproductibles aux mêmes octets (CT-6 EX-14.6, EX-14.8)
        run: |
          set -euo pipefail
          a="$RUNNER_TEMP/a"; b="$RUNNER_TEMP/b"
          mkdir -p "$a/src" "$b/src"
          cp -a verificateur "$a/src/verificateur"
          cp -a verificateur "$b/src/verificateur"
          GOCACHE="$a/cache" GOMODCACHE="$a/mod" "$a/src/verificateur/scripts/construire.sh" -o "$a/noortrace-verifier"
          GOCACHE="$b/cache" GOMODCACHE="$b/mod" "$b/src/verificateur/scripts/construire.sh" -o "$b/noortrace-verifier"
          sha256sum "$a/noortrace-verifier" "$b/noortrace-verifier"
          cmp "$a/noortrace-verifier" "$b/noortrace-verifier"
      - name: binaire vérificateur Go, preuves d'absence de réseau (CT-6 EX-14.5)
        run: |
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends strace
          sudo env "PATH=$PATH" GOTOOLCHAIN=local GOFLAGS=-mod=vendor verificateur/scripts/verifier-sans-reseau.sh
      # govulncheck sur le code et sur le binaire construit (CT-6 EX-14.11) :
      # code de retour lu hors du mode -json, qui rend toujours 0 ; une
      # vulnérabilité atteignable fait échouer l'étape.
      - name: binaire vérificateur Go, govulncheck sur le code et sur le binaire (CT-6 EX-14.11)
        run: |
          set -euo pipefail
          GOFLAGS= go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          (cd verificateur && govulncheck ./...)
          verificateur/scripts/construire.sh -o "$RUNNER_TEMP/noortrace-verifier"
          govulncheck -mode=binary "$RUNNER_TEMP/noortrace-verifier"
      # Fuzzing borné de chaque analyseur (CT-6 EX-15.3) : go test rejoue déjà
      # les graines ; chaque cible tourne ici 30 s.
      - name: binaire vérificateur Go, fuzzing borné de chaque analyseur (CT-6 EX-15.3)
        working-directory: verificateur
        run: |
          set -euo pipefail
          for cible in horodatage:FuzzJeton horodatage:FuzzCertificat horodatage:FuzzCRL ots:FuzzAnalyser ancres:FuzzAncres ancres:FuzzEntetes jcs:FuzzCanonique jsonv:FuzzAnalyser registre:FuzzRegistre registre:FuzzLigne; do
            paquet="${cible%%:*}"; fonction="${cible##*:}"
            go test -run '^$' -fuzz "^${fonction}\$" -fuzztime 30s "./${paquet}"
          done

  # Test de bout en bout de la console de référence de CT-3 dans Chromium
  # (spec/CT-3-approbations.md, EX-13.36, EX-A.11) : Playwright 1.56.1, la
  # version mesurée de console/LISEZMOI.md, est installé sans être ajouté à
  # package.json, puis son Chromium et les dépendances système du navigateur ;
  # ce travail accède au réseau pour ces deux téléchargements. Il tourne sur un
  # exécuteur Ubuntu 24.04 : Playwright 1.56.1 refuse d'installer Chromium sur
  # Ubuntu 26.04, le système d'ubuntu-latest (« Playwright does not support
  # chromium on ubuntu26.04-x64 »).
  # NOORTRACE_EXIGER_CHROMIUM=1 rend le saut impossible : si Playwright ou
  # Chromium ne se lancent pas, le test échoue au lieu d'être mis en attente,
  # et la dernière commande refuse toute ligne « pending » du rapport.
  # L'installation reprend chaque téléchargement des miroirs apt jusqu'à cinq
  # fois (Acquire::Retries), et l'installation entière au plus trois fois :
  # une panne passagère des miroirs ne fait pas échouer le travail, un échec
  # qui dure le fait toujours échouer.
  console-chromium:
    name: console de référence de CT-3 dans Chromium par Playwright 1.56.1, sans saut
    runs-on: ubuntu-24.04
    env:
      NOORTRACE_EXIGER_CHROMIUM: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - name: installer Playwright 1.56.1 hors de package.json, puis Chromium et ses dépendances
        run: |
          npm install --no-save playwright@1.56.1
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-noortrace-reprises
          for essai in 1 2 3; do
            if npx playwright install --with-deps chromium; then break; fi
            if [ "$essai" = 3 ]; then echo "installation de Chromium : échec après trois essais" >&2; exit 1; fi
            sleep 30
          done
      - name: test/console.test.js, aucun test Chromium en attente
        run: |
          set -o pipefail
          npx hardhat --config hardhat.config.mjs test test/console.test.js 2>&1 | tee "$RUNNER_TEMP/console.txt"
          if grep -E '^[[:space:]]+[0-9]+ pending' "$RUNNER_TEMP/console.txt"; then exit 1; fi

  # Étape 6 : console d'exploitation (paquets/console), page de vérification
  # (paquets/verification-web, CT-6 §18) et parcours du critère de livraison
  # (TE-13) dans les navigateurs de Playwright 1.56.1, installé hors de
  # package.json avec Chromium, Firefox et WebKit et leurs dépendances du
  # système (les trois moteurs de TE-23, CT-9 0.8) ; ce travail n'accède au
  # réseau que pour ces installations, jamais pendant les essais (tout se joue
  # sur la boucle locale). go1.27.3 exactement (CT-6 EX-14.3, EX-18.3)
  # construit l'artefact WebAssembly et le binaire noortrace-verifier ; l'arbre
  # /entrees d'EX-18.10 est monté par unshare --root dans un espace de noms
  # d'utilisateur, que l'AppArmor d'Ubuntu 24.04 restreint par défaut et que la
  # première étape autorise. NOORTRACE_EXIGER_CHROMIUM=1 rend le saut de
  # Chromium impossible ; chaque étape refuse toute ligne « pending » du
  # rapport, sauf, pour le parcours, la variante sur le réseau de
  # développement 2124 (quatre validateurs noorcore construits depuis
  # noorchain-core, absent de ce dépôt), en attente avec son message ; la
  # variante sans registre y est jouée sans saut. Les mutants des tests
  # adversariaux de l'étape 6 sont rejoués à part, chacun devant être tué.
  exploitation-chromium:
    name: console d'exploitation, page de vérification et parcours TE-13 de l'étape 6 dans Chromium, Firefox et WebKit par Playwright 1.56.1 (go1.27.3), sans saut hors du réseau de développement
    runs-on: ubuntu-24.04
    env:
      NOORTRACE_EXIGER_CHROMIUM: "1"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.27.3
          cache: false
      - run: npm ci
      - name: espaces de noms d'utilisateur pour unshare --root (arbre /entrees de CT-6 EX-18.10), outils des recettes d'archives
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --map-root-user --mount true
          zip -v | head -2
          tar --version | head -1
          openssl version
          python3 --version
      - name: installer Playwright 1.56.1 hors de package.json, puis Chromium, Firefox, WebKit et leurs dépendances
        run: |
          npm install --no-save playwright@1.56.1
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-noortrace-reprises
          for essai in 1 2 3; do
            if npx playwright install --with-deps chromium firefox webkit; then break; fi
            if [ "$essai" = 3 ]; then echo "installation des navigateurs : échec après trois essais" >&2; exit 1; fi
            sleep 30
          done
      - name: binaire vérificateur Go construit par verificateur/scripts/construire.sh (go1.27.3)
        run: |
          test "$(go env GOVERSION)" = go1.27.3
          GOFLAGS=-mod=vendor verificateur/scripts/construire.sh -o "$RUNNER_TEMP/noortrace-verifier"
          test -x "$RUNNER_TEMP/noortrace-verifier"
          sha256sum "$RUNNER_TEMP/noortrace-verifier"
      - name: bibliothèque et pages de la console d'exploitation dans Chromium, aucun essai en attente
        run: |
          set -o pipefail
          npx hardhat --config hardhat.config.mjs test $(ls test/exploitation-console-*-chromium.test.js) 2>&1 | tee "$RUNNER_TEMP/console-exploitation.txt"
          if grep -E '^[[:space:]]+[0-9]+ pending' "$RUNNER_TEMP/console-exploitation.txt"; then exit 1; fi
      - name: page de vérification dans Chromium, Firefox et WebKit (TE-23, TA-101), aucun essai en attente
        run: |
          set -o pipefail
          export NOORTRACE_GO_BIN="$(dirname "$(command -v go)")"
          npx hardhat --config hardhat.config.mjs test test/verification-page-chromium.test.js 2>&1 | tee "$RUNNER_TEMP/page.txt"
          if grep -E '^[[:space:]]+[0-9]+ pending' "$RUNNER_TEMP/page.txt"; then exit 1; fi
      - name: page de vérification, identité avec le binaire natif dans /entrees (CT-6 EX-18.10), aucun essai en attente
        run: |
          set -o pipefail
          export NOORTRACE_GO_BIN="$(dirname "$(command -v go)")"
          npx hardhat --config hardhat.config.mjs test test/verification-page-identite.test.js 2>&1 | tee "$RUNNER_TEMP/identite.txt"
          if grep -E '^[[:space:]]+[0-9]+ pending' "$RUNNER_TEMP/identite.txt"; then exit 1; fi
      - name: parcours TE-13 de la console d'exploitation, variante sans registre sans saut ; seule la variante du réseau de développement 2124 en attente, avec son message
        run: |
          set -o pipefail
          export NOORTRACE_GO_BIN="$(dirname "$(command -v go)")" NOORTRACE_VERIFIER_BIN="$RUNNER_TEMP/noortrace-verifier"
          npx hardhat --config hardhat.config.mjs test test/exploitation-console-parcours.test.js 2>&1 | tee "$RUNNER_TEMP/parcours-te13.txt"
          attentes=$(grep -cE '^[[:space:]]+- ' "$RUNNER_TEMP/parcours-te13.txt" || true)
          admises=$(grep -cE "^[[:space:]]+- .* — en attente : (le réseau de développement 2124 n'est pas debout|le validateur http://127\.0\.0\.1:[0-9]+ ne répond pas eth_chainId|deployments/noorcore\.json absent|chain/runtime/validators\.json absent)" "$RUNNER_TEMP/parcours-te13.txt" || true)
          echo "attentes : $attentes ; admises (réseau de développement 2124) : $admises"
          test "$attentes" = "$admises"
          if [ "$attentes" -gt 0 ]; then grep -E "^[[:space:]]+$attentes pending" "$RUNNER_TEMP/parcours-te13.txt"; fi
          grep -E '^[[:space:]]+[0-9]+ passing' "$RUNNER_TEMP/parcours-te13.txt"
          if grep -E '^[[:space:]]+[0-9]+ failing' "$RUNNER_TEMP/parcours-te13.txt"; then exit 1; fi
      - name: tests adversariaux de l'étape 6, mutants du service d'approbation, du serveur de console et du démon tués (TA-51, TA-77, TA-99, TA-100, TA-102), aucun essai en attente
        run: |
          set -o pipefail
          export NOORTRACE_GO_BIN="$(dirname "$(command -v go)")" NOORTRACE_VERIFIER_BIN="$RUNNER_TEMP/noortrace-verifier"
          npx mocha --exit --timeout 600000 --grep "TA-(51|77|99|100|102) :" test/approbation-service-configuration.test.js test/approbation-service-console.test.js test/approbation-service-notifications.test.js test/exploitation-console-serveur-oidc.test.js test/enregistreur-export-dossier.test.js 2>&1 | tee "$RUNNER_TEMP/adversarial-etape6.txt"
          grep -E '^[[:space:]]+5 passing' "$RUNNER_TEMP/adversarial-etape6.txt"
          if grep -E '^[[:space:]]+[0-9]+ (pending|failing)' "$RUNNER_TEMP/adversarial-etape6.txt"; then exit 1; fi

  # Essais Python du SDK noortrace-sdk et des adaptateurs de cadres (CT-2
  # 6.4 à 6.6 ; paquets/sdk-python, LISEZMOI « Environnements d'essai ») et
  # adaptateurs JavaScript : uv 0.11.32 (version exacte) installe Python 3.10
  # et 3.13 (suite du SDK seul, EX-6.5) et 3.12 (environnements des cadres :
  # crewai 1.15.30 exclut 3.14) ; les environnements isolés sont créés depuis
  # les verrous versionnés (empreintes SHA-256 exigées) ; go1.27.3 exactement
  # (CT-6 EX-14.3) construit le binaire noortrace-verifier par la recette
  # d'EX-14.6, et les essais lui soumettent les dossiers des parcours
  # (NOORTRACE_GO_BIN, répertoire de go). Un environnement absent ou un go
  # introuvable met un essai en attente : la dernière commande refuse toute
  # ligne « pending » du rapport, comme le travail Chromium.
  sdk-python:
    name: SDK Python et adaptateurs de cadres (Python 3.10, 3.12, 3.13 par uv 0.11.32, go1.27.3), sans essai en attente
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.27.3
          cache: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: 0.11.32
          enable-cache: false
      - run: npm ci
      - name: interpréteurs Python 3.10, 3.12 et 3.13 par uv, environnements d'essai depuis les verrous versionnés
        run: |
          uv --version
          uv python install 3.10 3.12 3.13
          paquets/sdk-python/outils/environnements.sh preparer
      - name: binaire vérificateur Go construit par verificateur/scripts/construire.sh (go1.27.3)
        run: |
          test "$(go env GOVERSION)" = go1.27.3
          GOFLAGS=-mod=vendor verificateur/scripts/construire.sh -o "$RUNNER_TEMP/noortrace-verifier"
          test -x "$RUNNER_TEMP/noortrace-verifier"
          sha256sum "$RUNNER_TEMP/noortrace-verifier"
      - name: essais Python du SDK et des adaptateurs, adaptateurs JavaScript, aucun essai en attente
        run: |
          set -o pipefail
          export NOORTRACE_GO_BIN="$(dirname "$(command -v go)")"
          npx hardhat --config hardhat.config.mjs test test/enregistreur-sdk-python.test.js test/enregistreur-sdk-adaptateurs.test.js 2>&1 | tee "$RUNNER_TEMP/sdk-python.txt"
          if grep -E '[0-9]+ pending' "$RUNNER_TEMP/sdk-python.txt"; then exit 1; fi

  # Parcours des signataires sur le démon réel (test/enregistreur-signataires-
  # parcours.test.js) : en production, le serveur d'outils stdio tourne sous
  # nobody, utilisateur distinct de celui du démon (CT-2 EX-3.5), ce qui exige
  # un démon lancé par le superutilisateur ; dans le travail « tests », ces
  # parcours sont donc en attente. Ici, ils sont joués sous sudo : SoftHSM2
  # (classe A), Vault et OpenBao Transit (classe B), LocalStack et swtpm avec
  # tpm2-tools (classe C), TE-16 ; versions des paquets du système imprimées ;
  # go1.27.3 exactement construit noortrace-verifier (EX-14.6). Le répertoire
  # personnel de l'exécuteur est rendu traversable pour que nobody lise le
  # serveur d'outils du dépôt. La dernière commande refuse toute ligne
  # « pending » du rapport, comme le travail Chromium.
  parcours-superutilisateur:
    name: parcours des signataires A, B et C en production sous le superutilisateur (EX-3.5), sans essai en attente
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.27.3
          cache: false
      - run: npm ci
      - name: SoftHSM2, swtpm et tpm2-tools par apt, versions imprimées
        run: |
          for essai in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=5 update --error-on=any \
              && sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends softhsm2 swtpm swtpm-tools tpm2-tools libtss2-tcti-swtpm0t64; then break; fi
            if [ "$essai" = 3 ]; then echo "apt : échec après trois essais" >&2; exit 1; fi
            sleep 30
          done
          dpkg-query -W softhsm2 libsofthsm2 swtpm swtpm-tools tpm2-tools libtss2-tcti-swtpm0t64
          docker info --format '{{.ServerVersion}}'
      - name: binaire vérificateur Go construit par verificateur/scripts/construire.sh (go1.27.3)
        run: |
          test "$(go env GOVERSION)" = go1.27.3
          GOFLAGS=-mod=vendor verificateur/scripts/construire.sh -o "$RUNNER_TEMP/noortrace-verifier"
          test -x "$RUNNER_TEMP/noortrace-verifier"
      - name: test/enregistreur-signataires-parcours.test.js sous sudo, aucun essai en attente
        run: |
          set -o pipefail
          chmod o+x "$HOME"
          sudo env "PATH=$PATH" "HOME=$HOME" "GOTOOLCHAIN=local" "NOORTRACE_GO_BIN=$(dirname "$(command -v go)")" \
            npx hardhat --config hardhat.config.mjs test test/enregistreur-signataires-parcours.test.js 2>&1 | tee "$RUNNER_TEMP/parcours.txt"
          if grep -E '[0-9]+ pending' "$RUNNER_TEMP/parcours.txt"; then exit 1; fi

  # Composant d'ancrage de CT-5 (paquets/ancrage) et son branchement dans
  # l'enregistreur (anchoring.ancrage), avec le binaire vérificateur Go de
  # CT-6 §14 (dossiers exportés vérifiés par les deux vérificateurs) et
  # python-opentimestamps 0.4.5 (relecture des preuves produites). Les essais
  # contre le réseau de développement noorcore (quatre validateurs construits
  # depuis noorchain-core, absent de ce dépôt) et contre les prestataires et
  # calendriers publics restent en attente ici : la dernière étape refuse toute
  # autre attente que celles-là, chacune nommée par sa condition.
  ancrage:
    name: composant d'ancrage de CT-5 et branchement dans l'enregistreur, avec le binaire vérificateur Go et python-opentimestamps
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.27.3
          cache: false
      - run: npm ci
      - name: binaire vérificateur Go construit par verificateur/scripts/construire.sh (go1.27.3) et python-opentimestamps 0.4.5
        run: |
          test "$(go env GOVERSION)" = go1.27.3
          GOFLAGS=-mod=vendor verificateur/scripts/construire.sh -o "$RUNNER_TEMP/noortrace-verifier"
          test -x "$RUNNER_TEMP/noortrace-verifier"
          python3 -m venv "$RUNNER_TEMP/venv-ots"
          "$RUNNER_TEMP/venv-ots/bin/pip" install --only-binary :all: opentimestamps==0.4.5 python-bitcoinlib==0.12.2
          openssl version
      - name: essais du composant d'ancrage et du branchement, attentes limitées au réseau de développement et au réseau public
        run: |
          set -o pipefail
          NOORTRACE_VERIFIER_BIN="$RUNNER_TEMP/noortrace-verifier" NOORTRACE_GO_BIN="$(dirname "$(command -v go)")" NOORTRACE_OTS_PYTHON="$RUNNER_TEMP/venv-ots/bin/python" \
            npx hardhat --config hardhat.config.mjs test $(ls test/ancrage-*.test.js test/enregistreur-ancrage-*.test.js) test/enregistreur-journal-soi.test.js test/enregistreur-cle-chaine-etape7.test.js 2>&1 | tee "$RUNNER_TEMP/ancrage.txt"
          node scripts/tests/attentes-ancrage.mjs "$RUNNER_TEMP/ancrage.txt"

  # Images noortrace/* de l'étape 7 (CT-8 §3.3, §3.6, EX-4.4 ; conteneurs/) :
  # construction double, sans cache, depuis deux copies des sources, par
  # scripts/deploiement/construire-images.mjs (bases épinglées par condensé,
  # npm ci depuis le verrou) ; les condensés des deux constructions doivent
  # être égaux. Aucune publication : rien n'est poussé vers un registre, aucune
  # étiquette n'est créée. Puis test/deploiement-images.test.js sur ces images
  # (TE-15, TM-24, TM-26, TM-28), sans aucun essai en attente ; et la
  # préparation de la version à blanc (TV-55, partie mécanique de TQ-8 ;
  # go1.27.3), sans rien signer ni publier, sans essai en attente.
  images:
    name: images noortrace/* de l'étape 7, construction double aux mêmes condensés et essais des images sans saut ; version préparée à blanc (go1.27.3), sans rien publier
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.27.3
          cache: false
      - run: npm ci
      - name: images noortrace/*, deux constructions sans cache aux mêmes condensés (CT-8 EX-3.13), sans publication
        run: |
          set -euo pipefail
          docker version
          node scripts/deploiement/construire-images.mjs --double --sortie "$RUNNER_TEMP/images"
          cat "$RUNNER_TEMP/images/condenses.json"
      - name: essais des images (TE-15, TM-24, TM-26, TM-28), aucun essai en attente
        run: |
          set -o pipefail
          NOORTRACE_IMAGES_CONDENSES="$RUNNER_TEMP/images/condenses.json" npx hardhat --config hardhat.config.mjs test test/deploiement-images.test.js 2>&1 | tee "$RUNNER_TEMP/images.txt"
          grep -E '^[[:space:]]+[0-9]+ passing' "$RUNNER_TEMP/images.txt"
          if grep -E '^[[:space:]]+[0-9]+ (pending|failing)' "$RUNNER_TEMP/images.txt"; then exit 1; fi
      - name: version préparée à blanc, deux préparations aux mêmes octets (TV-55, TQ-8), aucun essai en attente
        run: |
          set -o pipefail
          test "$(go env GOVERSION)" = go1.27.3
          npx hardhat --config hardhat.config.mjs test test/publication-etape7.test.js 2>&1 | tee "$RUNNER_TEMP/publication.txt"
          grep -E '^[[:space:]]+[0-9]+ passing' "$RUNNER_TEMP/publication.txt"
          if grep -E '^[[:space:]]+[0-9]+ (pending|failing)' "$RUNNER_TEMP/publication.txt"; then exit 1; fi

  # Confrontation des vecteurs CT-2, CT-3, CT-5, CT-6 et CT-7 par des
  # implémentations tierces (spec/CT-6-verificateur.md, annexe A.8 ;
  # spec/CT-5-ancrage.md, annexe A.6 ; spec/CT-2-enregistreur.md, annexes B.5
  # et B.8 ; spec/CT-3-approbations.md, annexe A.11 ;
  # spec/CT-7-securite-et-conformite.md, annexe A.13 ;
  # spec/vecteurs/ct-*/confrontation/). Les sorties publiées
  # (confrontation/sorties/) viennent d'OpenSSL 3.0.13, de
  # python-opentimestamps 0.4.5, de transparency-dev/merkle v0.0.2, de
  # google-genai 2.33.0, d'opentelemetry-proto 1.45.1 avec protobuf 7.36.2,
  # d'ethers 6.17.0 (celui du dépôt) et d'eth-account 0.14.0 ;
  # ici, chaque programme est rejoué avec l'OpenSSL de l'exécuteur, les mêmes
  # versions des paquets Python et la même version du module Go, et doit rendre
  # le code 0 (aucune discordance) ; les sorties de CT-2, de CT-3 et de CT-7
  # doivent en outre être égales, octet pour octet, aux sorties publiées. La
  # confrontation du registre (go-ethereum et noorcore) exige une copie de
  # noorchain-core : elle n'est pas rejouée ici, et test/confrontation.test.js
  # vérifie que sa sortie publiée porte sur les vecteurs du dépôt. Les paquets
  # réviseurs de CT-8 (spec/CT-8-deploiement-et-exploitation.md, annexe A.15)
  # sont lus et extraits par GNU tar et par tarfile de Python (filtre data) :
  # dernière étape du travail.
  confrontation:
    name: vecteurs CT-2, CT-3, CT-5, CT-6, CT-7 et CT-8 confrontés à openssl, à python-opentimestamps, à transparency-dev/merkle, à google-genai, à opentelemetry-proto, à ethers, à eth-account, à GNU tar et à tarfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      # CT-3 (annexe A.11, EX-A.18, EX-A.19) : chaque signature des vecteurs
      # (votes, remises, normalisation, console, inscriptions) recouvrée par
      # verifyMessage d'ethers, version du dépôt, après le contrôle de forme du
      # script (EX-9.22) ; fichiers de clé déchiffrés par
      # decryptKeystoreJsonSync. Code 0 et sortie égale à la sortie publiée.
      - name: CT-3 signatures par ethers
        run: |
          set -o pipefail
          node spec/vecteurs/ct-3/confrontation/ethers/confronter_ethers.mjs spec/vecteurs/ct-3 | tee "$RUNNER_TEMP/ethers.txt" | tail -1
          diff spec/vecteurs/ct-3/confrontation/sorties/ethers.txt "$RUNNER_TEMP/ethers.txt"
      # CT-3 (annexe A.11, EX-A.18, EX-A.19) : les mêmes signatures recouvrées
      # par Account.recover_message d'eth-account 0.14.0 (encode_defunct par
      # hexstr= et primitive= pour un vote, par primitive= et text= pour une
      # inscription), après le contrôle de forme du script (EX-9.22) ; fichiers
      # de clé déchiffrés par Account.decrypt ; versions exactes de toutes les
      # dépendances (exigences.txt, --no-deps). Code 0 et sortie égale à la
      # sortie publiée.
      - name: CT-3 signatures par eth-account 0.14.0 (environnement virtuel)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv-eth-account"
          "$RUNNER_TEMP/venv-eth-account/bin/pip" install --only-binary :all: --no-deps -r spec/vecteurs/ct-3/confrontation/eth-account/exigences.txt
          "$RUNNER_TEMP/venv-eth-account/bin/pip" check
          set -o pipefail
          "$RUNNER_TEMP/venv-eth-account/bin/python" -I spec/vecteurs/ct-3/confrontation/eth-account/confronter_eth_account.py spec/vecteurs/ct-3 | tee "$RUNNER_TEMP/eth-account.txt" | tail -1
          diff spec/vecteurs/ct-3/confrontation/sorties/eth-account.txt "$RUNNER_TEMP/eth-account.txt"
      # CT-7 (EX-A.24, EX-A.25, EX-A.27) : chaque signature des procès-verbaux
      # de ct-7/ceremonies/ recouvrée sur D_C, et chaque signature
      # d'attestation (ct-7/attestations/, dossiers de ct-1 et de ct-6 à
      # partie attestation-perimetre.json) recouvrée sur D_P, par verifyMessage
      # d'ethers, version du dépôt, après le contrôle de forme du programme
      # (CR-11, EX-7.6). Code 0 et sortie égale à la sortie publiée.
      - name: CT-7 signatures des procès-verbaux et des attestations par ethers
        run: |
          set -o pipefail
          node spec/vecteurs/ct-7/confrontation/ceremonies/confronter_ethers.mjs spec/vecteurs/ct-7 | tee "$RUNNER_TEMP/ct7-ceremonies-ethers.txt" | tail -1
          diff spec/vecteurs/ct-7/confrontation/ceremonies/sorties/ethers.txt "$RUNNER_TEMP/ct7-ceremonies-ethers.txt"
          node spec/vecteurs/ct-7/confrontation/attestations/confronter_ethers.mjs spec/vecteurs/ct-7 spec/vecteurs/ct-1 spec/vecteurs/ct-6 | tee "$RUNNER_TEMP/ct7-attestations-ethers.txt" | tail -1
          diff spec/vecteurs/ct-7/confrontation/attestations/sorties/ethers.txt "$RUNNER_TEMP/ct7-attestations-ethers.txt"
      # CT-7 (EX-A.24, EX-A.25, EX-A.27) : les mêmes signatures recouvrées par
      # Account.recover_message d'eth-account 0.14.0 (encode_defunct par
      # primitive= et hexstr= sur le condensé, par primitive= et text= pour le
      # texte d'inscription d'un cas croisé) ; versions exactes de toutes les
      # dépendances (exigences.txt de chaque répertoire, --no-deps). Code 0 et
      # sortie égale à la sortie publiée.
      - name: CT-7 signatures des procès-verbaux et des attestations par eth-account 0.14.0 (environnement virtuel)
        run: |
          set -o pipefail
          for partie in ceremonies attestations; do
            python3 -m venv "$RUNNER_TEMP/venv-ct7-$partie"
            "$RUNNER_TEMP/venv-ct7-$partie/bin/pip" install --only-binary :all: --no-deps -r spec/vecteurs/ct-7/confrontation/$partie/exigences.txt
            "$RUNNER_TEMP/venv-ct7-$partie/bin/pip" check
          done
          "$RUNNER_TEMP/venv-ct7-ceremonies/bin/python" -I spec/vecteurs/ct-7/confrontation/ceremonies/confronter_eth_account.py spec/vecteurs/ct-7 | tee "$RUNNER_TEMP/ct7-ceremonies-eth-account.txt" | tail -1
          diff spec/vecteurs/ct-7/confrontation/ceremonies/sorties/eth-account.txt "$RUNNER_TEMP/ct7-ceremonies-eth-account.txt"
          "$RUNNER_TEMP/venv-ct7-attestations/bin/python" -I spec/vecteurs/ct-7/confrontation/attestations/confronter_eth_account.py spec/vecteurs/ct-7 spec/vecteurs/ct-1 spec/vecteurs/ct-6 | tee "$RUNNER_TEMP/ct7-attestations-eth-account.txt" | tail -1
          diff spec/vecteurs/ct-7/confrontation/attestations/sorties/eth-account.txt "$RUNNER_TEMP/ct7-attestations-eth-account.txt"
      - name: rfc3161 par openssl (ts, cms, asn1parse, x509, crl, verify)
        run: |
          set -o pipefail
          openssl version
          python3 -I spec/vecteurs/ct-6/confrontation/rfc3161/confronter_rfc3161.py spec/vecteurs/ct-6 "$(mktemp -d)" | tail -12
      # CT-5 (spec/CT-5-ancrage.md, annexe A.6) : requêtes TimeStampReq et
      # réponses TimeStampResp par openssl (ts -query, asn1parse, ts -reply,
      # ts -verify), jetons des dossiers de CT-6 à partie points-de-controle.json
      # compris (CT-6 EX-A.17).
      - name: CT-5 requetes et reponses par openssl (ts -query, asn1parse, ts -reply, ts -verify)
        run: |
          set -o pipefail
          python3 -I spec/vecteurs/ct-5/confrontation/requetes/confronter_requetes.py spec/vecteurs/ct-5 "$(mktemp -d)" | tail -4
          python3 -I spec/vecteurs/ct-5/confrontation/reponses/confronter_reponses.py spec/vecteurs/ct-5 "$(mktemp -d)" | tail -6
      - name: ots par python-opentimestamps 0.4.5 (environnement virtuel, hors ligne après installation)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --only-binary :all: opentimestamps==0.4.5 python-bitcoinlib==0.12.2
          set -o pipefail
          "$RUNNER_TEMP/venv/bin/python" -I spec/vecteurs/ct-6/confrontation/ots/confronter_ots.py spec/vecteurs/ct-6 | tail -6
          "$RUNNER_TEMP/venv/bin/python" -I spec/vecteurs/ct-5/confrontation/ots/confronter_ots.py spec/vecteurs/ct-5 | tail -4
      # CT-2 (annexe B.5) : requêtes, réponses, morceaux de flux, formes
      # consolidées et refus des cas pieces-modele/gemini-* analysés par les
      # types et le client du SDK officiel (transport simulé, sans réseau) ;
      # versions exactes de toutes les dépendances (exigences.txt, --no-deps).
      - name: CT-2 Gemini par google-genai 2.33.0 (environnement virtuel, hors ligne après installation)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv-genai"
          "$RUNNER_TEMP/venv-genai/bin/pip" install --only-binary :all: --no-deps -r spec/vecteurs/ct-2/confrontation/gemini/exigences.txt
          "$RUNNER_TEMP/venv-genai/bin/pip" check
          set -o pipefail
          "$RUNNER_TEMP/venv-genai/bin/python" -I spec/vecteurs/ct-2/confrontation/gemini/confronter_gemini.py spec/vecteurs/ct-2 | tee "$RUNNER_TEMP/gemini.txt" | tail -3
          diff spec/vecteurs/ct-2/confrontation/sorties/gemini.txt "$RUNNER_TEMP/gemini.txt"
      # CT-2 (section 6.8, annexe B.8) : requêtes OTLP JSON et protobuf de la
      # famille otel/ analysées en ExportTraceServiceRequest (json_format.Parse
      # après conversion des identifiants, FromString), forme normalisée de
      # chaque span recalculée et comparée, réponses, paires JSON / protobuf.
      - name: CT-2 otel par opentelemetry-proto 1.45.1 et protobuf 7.36.2 (environnement virtuel)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv-otel"
          "$RUNNER_TEMP/venv-otel/bin/pip" install --only-binary :all: --no-deps -r spec/vecteurs/ct-2/confrontation/otel/exigences.txt
          "$RUNNER_TEMP/venv-otel/bin/pip" check
          set -o pipefail
          "$RUNNER_TEMP/venv-otel/bin/python" -I spec/vecteurs/ct-2/confrontation/otel/confronter_otel.py spec/vecteurs/ct-2 | tee "$RUNNER_TEMP/otel.txt" | tail -6
          diff spec/vecteurs/ct-2/confrontation/sorties/otel.txt "$RUNNER_TEMP/otel.txt"
      # Version de Go épinglée à celle des sorties publiées (en-tête de
      # sorties/coherence.txt : go1.24.7) ; ce job, seul de la CI, accède au
      # réseau (pip et mandataire de modules Go), CT-5 EX-A.7.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.24.7"
          cache-dependency-path: spec/vecteurs/ct-5/confrontation/coherence/go.sum
      # CT-5 (annexe A.6) et CT-1 §10.7 : preuves de cohérence RFC 9162 des
      # vecteurs CT-1 révision 0.3 (merkle/coherence.json, points-de-controle/
      # attendu.json, parties points-de-controle.json des dossiers de CT-1 et de
      # CT-6) confrontées à l'implémentation de référence transparency-dev/merkle
      # v0.0.2 : racines et preuves régénérées nœud pour nœud, verdicts de
      # proof.VerifyConsistency, sondes de corruption. Le module Go est résolu
      # par le proxy de modules (go.sum épinglé), comme pip pour opentimestamps.
      - name: CT-1 preuves de cohérence par transparency-dev/merkle v0.0.2 (RFC 6962 et 9162)
        working-directory: spec/vecteurs/ct-5/confrontation/coherence
        run: |
          set -o pipefail
          gofmt -l . && test -z "$(gofmt -l .)"
          go vet ./...
          go run . ../../../ct-1 ../../../ct-6 | tail -4
      # CT-8 (annexe A.15, EX-A.32 à EX-A.35) : chaque paquet réviseur de
      # spec/vecteurs/ct-8/paquets/ listé et extrait par GNU tar dans un
      # répertoire neuf, SHA-256 recalculés par sha256sum contre cas.json et
      # contre le manifeste extrait, reconstruction de valide.tar par la recette
      # d'EX-13.15 ; puis lu et extrait par tarfile (filter="data") de Python
      # 3.13, SHA-256 par hashlib. Code 0 exigé (aucune discordance) ; sorties
      # égales octet pour octet aux sorties publiées quand la première ligne
      # (versions des outils) est la même ; dans tous les cas, partie CT-8 de
      # test/confrontation.test.js appliquée aux nouvelles sorties (membres
      # égaux à ceux de lireArchive, résultats égaux à la table d'EX-A.32,
      # limites d'EX-A.33). Dernière étape du travail : setup-python ne change
      # pas l'interpréteur des étapes précédentes.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: python-ct8
        with:
          python-version: "3.13"
      - name: CT-8 paquets réviseurs par GNU tar, sha256sum et tarfile de Python (filtre data)
        run: |
          set -o pipefail
          C=spec/vecteurs/ct-8/confrontation/paquets
          S="$RUNNER_TEMP/ct8-sorties"
          mkdir "$S"
          bash "$C/confronter_gnutar.sh" spec/vecteurs/ct-8/paquets "$(mktemp -d)" > "$S/gnutar.txt"
          "${{ steps.python-ct8.outputs.python-path }}" -I "$C/confronter_tarfile.py" spec/vecteurs/ct-8/paquets "$(mktemp -d)" > "$S/tarfile.txt"
          for f in gnutar tarfile; do
            head -1 "$S/$f.txt"
            tail -1 "$S/$f.txt"
            if [ "$(head -1 "$S/$f.txt")" = "$(head -1 "$C/sorties/$f.txt")" ]; then
              diff "$C/sorties/$f.txt" "$S/$f.txt"
            else
              echo "$f : versions autres que celles de la sortie publiée ($(head -1 "$C/sorties/$f.txt")) ; résultats comparés par le test"
            fi
          done
          # Exploitation (EX-A.30) : sha256sum et jq, puis json et hashlib de Python.
          E=spec/vecteurs/ct-8/confrontation/exploitation
          bash "$E/confronter_sha256sum.sh" spec/vecteurs/ct-8 > "$S/sha256sum.txt"
          "${{ steps.python-ct8.outputs.python-path }}" -I "$E/confronter_consultations.py" spec/vecteurs/ct-8 > "$S/consultations.txt"
          for f in sha256sum consultations; do
            tail -1 "$S/$f.txt"
            if [ "$(head -1 "$S/$f.txt")" = "$(head -1 "$E/sorties/$f.txt")" ]; then diff "$E/sorties/$f.txt" "$S/$f.txt"; fi
          done
          NOORTRACE_CT8_SORTIES="$S" NOORTRACE_PYTHON_CONFRONTATION="${{ steps.python-ct8.outputs.python-path }}" \
            npx mocha test/confrontation.test.js --grep "CT-8"
      # CT-9 (annexe A.11, EX-A.18) : recomptage indépendant en Python
      # (bibliothèque standard) des identifiants de spec/*.md, des menaces,
      # des titres de tests, des it TA-, des lignes TM- et TR-, comparé à
      # couverture.json et au catalogue ; code 0 et sortie égale, octet pour
      # octet, à la sortie publiée.
      - name: CT-9 recomptage indépendant en Python (python3 -I, bibliothèque standard)
        run: |
          set -o pipefail
          python3 -I spec/vecteurs/ct-9/confrontation/recompter.py . | tee "$RUNNER_TEMP/ct9-recompte.txt" | tail -1
          diff spec/vecteurs/ct-9/confrontation/sorties/recompte.txt "$RUNNER_TEMP/ct9-recompte.txt"
