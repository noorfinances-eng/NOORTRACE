# Tests des règles d'alerte de référence (CT-8 EX-10.10), au format de
# promtool test rules : pour chaque règle, des séries qui la déclenchent et
# des séries qui ne la déclenchent pas. Écrit par
# node scripts/deploiement/regles.mjs --reference ; ne pas éditer à la main.
#
#   promtool check rules deploiement/observabilite/regles-noortrace.yml
#   promtool test rules deploiement/observabilite/tests-regles.yml
rule_files:
  - regles-noortrace.yml
evaluation_interval: 1m
tests:
  - name: 'noortrace_mode_degrade_critique déclenchée'
    interval: 1m
    input_series:
      - series: 'noortrace_degraded{instance="127.0.0.1:8500", job="enregistreur", reason="cle", role="active"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: noortrace_mode_degrade_critique
        exp_alerts:
          - exp_labels:
              component: 'enregistreur'
              exigence: 'CT-2 §17.4 Mode dégradé'
              instance: '127.0.0.1:8500'
              reason: 'cle'
              runbook: 'RB-1, RB-2, RB-6, RB-8'
              severity: 'critique'
            exp_annotations:
              summary: 'Mode dégradé pour la clé, le bail ou l''horloge'
              description: 'Mode dégradé pour la clé, le bail ou l''horloge. Gravité critique, composant enregistreur. Exigence : CT-2 §17.4 Mode dégradé. Runbook : RB-1, RB-2, RB-6, RB-8.'
  - name: 'noortrace_mode_degrade_critique silencieuse'
    interval: 1m
    input_series:
      - series: 'noortrace_degraded{instance="127.0.0.1:8500", job="enregistreur", reason="cle", role="active"}'
        values: '0x10'
      - series: 'noortrace_degraded{instance="127.0.0.1:8500", job="enregistreur", reason="stockage", role="active"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: noortrace_mode_degrade_critique
        exp_alerts: []
  - name: 'noortrace_mode_degrade_majeur déclenchée'
    interval: 1m
    input_series:
      - series: 'noortrace_degraded{instance="127.0.0.1:8500", job="enregistreur", reason="stockage", role="active"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: noortrace_mode_degrade_majeur
        exp_alerts:
          - exp_labels:
              component: 'enregistreur'
              exigence: 'CT-2 §17.4 Mode dégradé'
              instance: '127.0.0.1:8500'
              reason: 'stockage'
              runbook: 'RB-1'
              severity: 'majeure'
            exp_annotations:
              summary: 'Mode dégradé pour le stockage, l''attente ou l''approbation'
              description: 'Mode dégradé pour le stockage, l''attente ou l''approbation. Gravité majeure, composant enregistreur. Exigence : CT-2 §17.4 Mode dégradé. Runbook : RB-1.'
